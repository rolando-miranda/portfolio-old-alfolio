# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: Rolando Miranda
first_name: Rolando
middle_name:
last_name: Miranda
email: rolomiranda98@gmail.com
description: >
  Mechanical engineer working at the intersection of medical device
  manufacturing, mechatronics, and thermal systems. MS candidate at NYU Tandon.
footer_text: >
  Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> with
  <a href="https://github.com/alshedivat/al-folio" target="_blank">al-folio</a> theme.
keywords: mechanical engineering, manufacturing engineering, medical devices, mechatronics, thermal systems, NYU Tandon
lang: en
icon: ⚙️

url: https://rolomiranda98.github.io   # <-- CHANGE if your GitHub username differs
baseurl:

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: true
max_width: 800px

# Dark Mode
enable_darkmode: true
default_mode: light

# Math
enable_math: true

# -----------------------------------------------------------------------------
# Open Graph & SEO
# -----------------------------------------------------------------------------

serve_og_meta: true
serve_schema_org: true

# -----------------------------------------------------------------------------
# Profile
# -----------------------------------------------------------------------------

# Set to true if you want to display a Resume / CV page generated from _data/cv.yml
cv_pdf: cv.pdf   # optional — drop a PDF copy at assets/pdf/cv.pdf if you want a download link

# Social
github_username: rolomiranda98   # <-- CHANGE to your actual GitHub username
linkedin_username:   # <-- ADD your LinkedIn handle
scholar_userid:
orcid_id:

# Optional GitHub repo & language widgets on the repositories page
display_external_shield: true

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  news:
    defaults:
      layout: post
    output: true
    permalink: /news/:path/
  projects:
    output: true
    permalink: /projects/:path/

news_limit: 8

# -----------------------------------------------------------------------------
# Jekyll plugins (already included in al-folio's Gemfile)
# -----------------------------------------------------------------------------

plugins:
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-target-blank
  - jemoji
